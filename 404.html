<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Viewography</title>
  <!-- View Buddies invites (viewography.app/i/<token>#<code>) land here when the app isn't
       installed. The page and its preview stay generic: the site never sees who sent the invite. -->
  <meta property="og:title" content="You've been invited to View Buddies">
  <meta property="og:description" content="Accept in Viewography.">
  <meta property="og:site_name" content="Viewography">
  <meta name="description" content="You've been invited to View Buddies. Accept in Viewography.">
  <link rel="stylesheet" href="/style.css">
  <style>
    .invite{max-width:420px;margin:12vh auto 0;width:calc(100% - 44px)}
    .invite-card{background:#060707;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
    .invite-card .brand{justify-content:flex-start;font-size:2.4rem;width:auto;margin:0}
    .invite-title{font-size:2.1rem;font-weight:900;letter-spacing:-.03em;line-height:1;margin:0}
    .invite-card p{margin:0}
    .invite-button{display:block;text-align:center;background:#fff;color:#000;border:0;border-radius:14px;padding:16px;font-weight:650;margin-top:22px}
    .invite-button:hover{background:#e6e6e6;color:#000}
    .invite-note{color:var(--muted);font-size:.95rem;margin-top:14px}
    .missing{display:none}
  </style>
</head>
<body>
  <main class="invite" id="invite">
    <div class="invite-card">
      <div class="brand" aria-label="Viewography">
        <span class="brand-view">VI</span><span class="brand-e" aria-hidden="true"><i></i><i></i><i></i></span><span class="brand-view">W</span>
      </div>
      <h1 class="invite-title">WITH ME</h1>
      <p>You've been invited to View Buddies.</p>
      <p class="muted">Accept in Viewography.</p>
    </div>
    <a class="invite-button" href="https://testflight.apple.com/join/TESTFLIGHT_CODE">Get Viewography</a>
    <p class="invite-note">Viewography is in beta on TestFlight. Once it's installed, tap the invite link again to accept.</p>
  </main>
  <main class="page missing" id="missing">
    <h1>Not found</h1>
    <p>That page isn't here. <a href="/">Go to Viewography</a>.</p>
  </main>
  <script>
    // Anything that isn't an invite gets an ordinary not-found page.
    if (!/^\/i\/[A-Za-z0-9_-]+\/?$/.test(location.pathname)) {
      document.getElementById('invite').style.display = 'none';
      document.getElementById('missing').style.display = 'block';
    }
  </script>
</body>
</html>
